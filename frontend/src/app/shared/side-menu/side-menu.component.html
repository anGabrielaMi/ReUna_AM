<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menú</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list>
      <ion-item routerLink="/avisos" button detail="false">
        <ion-icon slot="start" name="notifications-outline"></ion-icon>
        <ion-label>Avisos</ion-label>
      </ion-item>
      <ion-item routerLink="/calendario" button detail="false">
        <ion-icon slot="start" name="calendar-outline"></ion-icon>
        <ion-label>Histórico</ion-label>
      </ion-item>
      <ion-item routerLink="/encuestas" button detail="false">
        <ion-icon slot="start" name="help-circle-outline"></ion-icon>
        <ion-label>Encuestas</ion-label>
      </ion-item>
      <ion-item routerLink="/documentos" button detail="false">
        <ion-icon slot="start" name="document-text-outline"></ion-icon>
        <ion-label>Documentos</ion-label>
      </ion-item>
      <ion-item routerLink="/ayuda" button detail="false">
        <ion-icon slot="start" name="information-circle-outline"></ion-icon>
        <ion-label>Ayuda</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Área principal que se desplaza cuando se abre el menú -->
<div id="main-content">
  <ng-content></ng-content>
</div>
