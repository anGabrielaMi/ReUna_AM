<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Recuperar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>¿Olvidaste tu contraseña?</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="enviar()">
        <ion-item>
          <ion-label position="floating">Correo electrónico</ion-label>
          <ion-input [(ngModel)]="email" name="email" type="email" required></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" [disabled]="enviando">
          Enviar instrucciones
        </ion-button>
      </form>

      <ion-text color="success" *ngIf="mensaje">
        <p>{{ mensaje }}</p>
      </ion-text>

      <ion-text color="danger" *ngIf="error">
        <p>{{ error }}</p>
      </ion-text>

      <div class="text-center mt-3">
        <a routerLink="/login">Volver a iniciar sesión</a>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
