<ion-header>
  <ion-toolbar>
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Crear cuenta</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="onRegister()">
        <ion-item>
          <ion-label position="floating">Usuario</ion-label>
          <ion-input [(ngModel)]="username" name="username" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Correo</ion-label>
          <ion-input [(ngModel)]="email" name="email" type="email" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input [(ngModel)]="password" name="password" type="password" required></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit">Registrarse</ion-button>
      </form>

      <!-- Mensajes de feedback -->
      <ion-text color="danger" *ngIf="errorMsg">
        {{ errorMsg }}
      </ion-text>

      <ion-text color="success" *ngIf="successMsg">
        {{ successMsg }}
      </ion-text>

      <!-- Link a login -->
      <div class="text-center mt-3">
        <small>¿Ya tienes cuenta?</small><br>
        <a routerLink="/login" class="btn btn-link">Inicia sesión aquí</a>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
