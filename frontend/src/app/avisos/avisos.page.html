<ion-header>
  <ion-toolbar>
    <ion-title>Avisos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <section class="page-header">
    <h1>Bienvenido</h1>
    <p>Explora tus avisos en un solo lugar.</p>
  </section>

  <main class="cards-grid">
    <ion-card *ngFor="let aviso of avisos">
      <ion-card-header>
        <ion-card-title>{{ aviso.titulo }}</ion-card-title>
        <ion-card-subtitle>Publicado: {{ aviso.fecha_publicacion }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        {{ aviso.contenido }}
      </ion-card-content>
      <ion-item lines="none">
        <ion-button fill="clear" slot="end">
          Ver aviso
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-card>

    <!-- Mensaje si no hay avisos -->
    <div *ngIf="avisos.length === 0" class="no-avisos">
      <p>No hay avisos disponibles.</p>
    </div>
  </main>
</ion-content>
