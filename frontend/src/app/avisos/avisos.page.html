<ion-header>
  <ion-toolbar>
    <ion-title>Panel Principal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="app-shell">
    <!-- Menú lateral -->
    <aside class="side-bar" aria-label="Navegación principal">
      <div class="side-bar-title">
        <ion-icon name="sparkles-outline"></ion-icon>
        <span>Panel Principal</span>
      </div>
      <ion-list>
        <ion-item button detail="false">
          <ion-icon slot="start" name="notifications-outline"></ion-icon>
          <ion-label>Avisos</ion-label>
        </ion-item>
        <ion-item button detail="false">
          <ion-icon slot="start" name="calendar-outline"></ion-icon>
          <ion-label>Calendario</ion-label>
        </ion-item>
        <ion-item button detail="false">
          <ion-icon slot="start" name="help-circle-outline"></ion-icon>
          <ion-label>Encuestas</ion-label>
        </ion-item>
        <ion-item button detail="false">
          <ion-icon slot="start" name="document-text-outline"></ion-icon>
          <ion-label>Documentos</ion-label>
        </ion-item>
        <ion-item button detail="false">
          <ion-icon slot="start" name="information-circle-outline"></ion-icon>
          <ion-label>Ayuda</ion-label>
        </ion-item>
      </ion-list>
    </aside>

    <!-- Área de contenido -->
    <div class="content-area">
      <section class="page-header">
        <h1>Bienvenido</h1>
        <p>Explora tus avisos, eventos y documentos en un solo lugar.</p>
      </section>

      <!-- Cards dinámicas -->
      <main class="cards-grid">
        <ion-card *ngFor="let aviso of avisos">
          <ion-card-header>
            <ion-card-title>{{ aviso.titulo }}</ion-card-title>
            <ion-card-subtitle>Publicado: {{ aviso.fecha_publicacion }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            {{ aviso.contenido }}
          </ion-card-content>
          <ion-item lines="none">
            <ion-button fill="clear" slot="end">
              Ver aviso
              <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
            </ion-button>
          </ion-item>
        </ion-card>

        <!-- Mensaje si no hay avisos -->
        <div *ngIf="avisos.length === 0" class="no-avisos">
          <p>No hay avisos disponibles.</p>
        </div>
      </main>
    </div>
  </div>
</ion-content>
