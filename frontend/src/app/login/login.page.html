<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Iniciar sesión</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="login()">
        <ion-item>
          <ion-label position="floating">Usuario</ion-label>
          <ion-input [(ngModel)]="username" name="username" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input [(ngModel)]="password" name="password" type="password" required></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit">Entrar</ion-button>
      </form>

      <div class="text-center mt-3">
        <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <ion-text color="danger" *ngIf="errorMsg">
        {{ errorMsg }}
      </ion-text>

      <div class="text-center mt-3">
        <small>¿No tienes cuenta?</small><br>
        <a routerLink="/register" class="btn btn-link">Registrarse aquí</a>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
