<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div id="container">
    <!-- Navegación general: saludo según haya o no sesión -->
    <h2 *ngIf="sesion.logueado(); else invitado">Hola, {{ sesion.usuario() }} 🌿</h2>
    <ng-template #invitado><h2>Bienvenid@ a Reúna 🌿</h2></ng-template>

    <p>Selecciona una opción desde el menú lateral.</p>

    <div class="acciones">
      <ion-button routerLink="/avisos">Ver avisos</ion-button>
      <ion-button *ngIf="!sesion.logueado()" routerLink="/login" fill="outline">Iniciar sesión</ion-button>
    </div>
  </div>
</ion-content>
