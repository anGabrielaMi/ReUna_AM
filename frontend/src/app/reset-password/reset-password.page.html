<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Nueva contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Restablecer contraseña</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="confirmar()" *ngIf="uid && token">
        <ion-item>
          <ion-label position="floating">Nueva contraseña</ion-label>
          <ion-input [(ngModel)]="newPassword" name="newPassword" type="password" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Confirmar contraseña</ion-label>
          <ion-input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" [disabled]="enviando">
          Guardar nueva contraseña
        </ion-button>
      </form>

      <ion-text color="success" *ngIf="mensaje">
        <p>{{ mensaje }}</p>
      </ion-text>

      <ion-text color="danger" *ngIf="error">
        <p>{{ error }}</p>
      </ion-text>

      <div class="text-center mt-3" *ngIf="!uid || !token">
        <a routerLink="/forgot-password">Solicitar un nuevo enlace</a>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
